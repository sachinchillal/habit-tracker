  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">

  <!--
    Apply the saved theme before the first paint so dark mode doesn't flash white.
    Keep in sync with ThemeService.apply(); the storage key is
    environment.localStorageKey + 'ThemeType' (see StoreService).
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('habitTrackerThemeType');
        var dark = saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light');
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', dark ? '#020617' : '#ffffff');
        }
      } catch (e) { }
    })();
  </script>
