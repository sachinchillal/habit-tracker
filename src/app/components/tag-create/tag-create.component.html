<form (ngSubmit)="onSubmit()">
  <div class="flex flex-col gap-2 p-4 border dark:border-gray-700 rounded shadow">
    <h2 class="text-xl font-bold mb-1">{{ isEditing ? 'Edit tag' : 'Add tag' }}</h2>

    <label class="text-sm font-medium text-gray-700 dark:text-gray-200" for="tag-name">Name</label>
    <input id="tag-name" type="text" placeholder="Name" maxlength="40" [(ngModel)]="tag.name" name="name"
      autocomplete="off"
      class="border p-2 rounded dark:bg-gray-800 dark:border-gray-600 dark:text-white" />

    <label class="text-sm font-medium text-gray-700 dark:text-gray-200" for="tag-description">Description</label>
    <textarea id="tag-description" maxlength="200"
      class="border p-2 rounded resize-none min-h-[80px] dark:bg-gray-800 dark:border-gray-600 dark:text-white"
      placeholder="Description" [(ngModel)]="tag.description" name="description"></textarea>

    <div>
      <span class="text-sm font-medium text-gray-700 dark:text-gray-200" id="tag-color-label">Color</span>
      <div class="flex flex-wrap items-center gap-2 mt-2" role="group" aria-labelledby="tag-color-label">
        @for (preset of colorPresets; track preset.value) {
          <button type="button" (click)="selectColor(preset.value)"
            class="h-7 w-7 rounded-full border border-black/10 dark:border-white/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
            [ngClass]="isColorSelected(preset.value) ? 'ring-2 ring-offset-2 ring-slate-900 dark:ring-slate-100 dark:ring-offset-slate-900' : ''"
            [style.backgroundColor]="preset.value"
            [attr.aria-pressed]="isColorSelected(preset.value)"
            [attr.aria-label]="preset.name"></button>
        }
        <label class="inline-flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
          Custom
          <input type="color" name="color" [ngModel]="tag.color" (ngModelChange)="selectColor($event)"
            class="h-8 w-10 cursor-pointer rounded border border-gray-300 dark:border-gray-600 bg-transparent p-0.5"
            aria-label="Custom tag color" />
        </label>
      </div>
    </div>

    <div>
      <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Preview</span>
      <div class="mt-1">
        <app-tag-chips [tags]="previewTags" ariaLabel="Tag preview" />
      </div>
    </div>

    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox" class="h-4 w-4 accent-blue-600" [(ngModel)]="appService.autoClear" name="autoClear" />
      <span class="text-sm text-gray-700 dark:text-gray-200">Auto clear</span>
    </label>

    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 disabled:opacity-50" type="submit"
      [disabled]="tag.name.trim().length < 2">
      {{ isEditing ? 'Update tag' : 'Create tag' }}
    </button>
    @if (isEditing) {
      <button title="Cancel edit" type="button" (click)="resetForm()"
        class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-red-900">Cancel edit</button>
    }
  </div>
</form>
