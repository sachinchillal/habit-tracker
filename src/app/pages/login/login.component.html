<section class="w-full max-w-md mx-auto px-2 py-10 sm:py-16 text-center">
  <img [src]="logoSrc" alt="" width="64" height="64" class="h-16 w-16 mb-6 mx-auto">
  <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">
    Sign in to continue
  </h1>
  <p class="mt-3 text-slate-600 dark:text-slate-400">
    Habit Tracker uses your Addhuri account. Sign in or create an account, and you'll be brought back to
    the page you were opening.
  </p>
  <div class="mt-6 flex flex-col sm:flex-row justify-center gap-3">
    <a [href]="signInUrl" class="primary-btn no-underline">Sign in</a>
    <a [href]="signUpUrl" class="secondary-btn no-underline">Create account</a>
  </div>
  <p class="mt-6 text-xs text-slate-500 dark:text-slate-400">
    One Addhuri account works across all Addhuri apps.
  </p>
</section>
